[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shear-agent"
version = "0.0.1"
description = "Shear-aware agentic grasping with an ultrasonic tactile parallel-jaw gripper"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dohyun" }, { name = "Jihoon" }]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
